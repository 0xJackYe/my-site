<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Programming, communication, English, and industry experience progressively reduce the number of people who meet every condition</title>
  <desc id="desc">Figure: You do not need to beat everyone on one axis; the intersection of complementary abilities can itself be scarce.</desc>
  <rect width="1200" height="675" fill="#f3f0e8"/>
  <style>
    text { font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif; fill: #181714; letter-spacing: 0; }
    .eyebrow { font-size: 21px; font-weight: 700; }
    .label { font-size: 28px; font-weight: 700; }
    .small { font-size: 17px; fill: #706b61; }
    .number { font-size: 17px; font-weight: 700; fill: #a65032; }
    .inverse { fill: #f3f0e8; }
    .node { fill: #fffdf8; stroke: #181714; stroke-width: 2; }
    .soft { fill: none; stroke: #b8b0a3; stroke-width: 2; }
    .strong { fill: none; stroke: #181714; stroke-width: 3; }
    .accent { fill: none; stroke: #a65032; stroke-width: 4; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#181714"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a65032"/></marker>
  </defs>
  <g><rect x="125" y="105" width="950" height="78" rx="3" fill="#ded8cc" stroke="#181714" stroke-width="2"/><text class="label" x="149" y="154" style="font-size:28px">Programming</text><text class="small" x="1051" y="152" text-anchor="end" style="fill:#706b61">50%</text></g><g><rect x="240" y="225" width="720" height="78" rx="3" fill="#fffdf8" stroke="#181714" stroke-width="2"/><text class="label" x="264" y="274" style="font-size:28px">+ Communication</text><text class="small" x="936" y="272" text-anchor="end" style="fill:#706b61">20%</text></g><g><rect x="350" y="345" width="500" height="78" rx="3" fill="#ded8cc" stroke="#181714" stroke-width="2"/><text class="label" x="374" y="394" style="font-size:28px">+ English</text><text class="small" x="826" y="392" text-anchor="end" style="fill:#706b61">Fewer</text></g><g><rect x="455" y="465" width="290" height="78" rx="3" fill="#a65032" stroke="#181714" stroke-width="2"/><text class="label" x="479" y="514" style="font-size:25px">Full skill stack</text><text class="small" x="721" y="512" text-anchor="end" style="fill:#f3f0e8">Scarce</text></g><path class="soft" d="M125 602 H1075"/><text class="small" x="600" y="635" text-anchor="middle">Each complementary dimension narrows the field</text>
</svg>
