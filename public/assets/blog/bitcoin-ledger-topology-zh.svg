<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">单一机构记账与多个节点共同维护同一账本的对比图</title>
  <desc id="desc">图：传统系统把信任集中在一个记账者，比特币把核验分散给网络节点。</desc>
  <rect width="1200" height="675" fill="#f3f0e8"/>
  <style>
    text { font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif; fill: #181714; letter-spacing: 0; }
    .eyebrow { font-size: 21px; font-weight: 700; }
    .label { font-size: 28px; font-weight: 700; }
    .small { font-size: 17px; fill: #706b61; }
    .number { font-size: 17px; font-weight: 700; fill: #a65032; }
    .inverse { fill: #f3f0e8; }
    .node { fill: #fffdf8; stroke: #181714; stroke-width: 2; }
    .soft { fill: none; stroke: #b8b0a3; stroke-width: 2; }
    .strong { fill: none; stroke: #181714; stroke-width: 3; }
    .accent { fill: none; stroke: #a65032; stroke-width: 4; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#181714"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a65032"/></marker>
  </defs>
  <text class="eyebrow" x="300" y="74" text-anchor="middle">中心化记账</text><text class="eyebrow" x="900" y="74" text-anchor="middle">分布式账本</text><path class="soft" d="M600 55 V620"/><circle cx="170" cy="210" r="27" fill="#fffdf8" stroke="#b8b0a3" stroke-width="2"/><path class="soft" d="M170 210 L300 350"/><circle cx="90" cy="350" r="27" fill="#fffdf8" stroke="#b8b0a3" stroke-width="2"/><path class="soft" d="M90 350 L300 350"/><circle cx="170" cy="500" r="27" fill="#fffdf8" stroke="#b8b0a3" stroke-width="2"/><path class="soft" d="M170 500 L300 350"/><circle cx="430" cy="210" r="27" fill="#fffdf8" stroke="#b8b0a3" stroke-width="2"/><path class="soft" d="M430 210 L300 350"/><circle cx="510" cy="350" r="27" fill="#fffdf8" stroke="#b8b0a3" stroke-width="2"/><path class="soft" d="M510 350 L300 350"/><circle cx="430" cy="500" r="27" fill="#fffdf8" stroke="#b8b0a3" stroke-width="2"/><path class="soft" d="M430 500 L300 350"/><rect x="235" y="285" width="130" height="130" rx="3" fill="#181714"/><path d="M265 325 h70 M265 345 h70 M265 365 h50" stroke="#f3f0e8" stroke-width="5"/><text class="label" x="300" y="460" text-anchor="middle">单一账本</text><text class="small" x="300" y="495" text-anchor="middle">单点信任</text><path class="soft" d="M780 210 L675 350"/><path class="soft" d="M780 210 L1010 210"/><path class="soft" d="M675 350 L780 500"/><path class="soft" d="M675 350 L1115 350"/><path class="soft" d="M780 500 L1010 500"/><path class="soft" d="M1010 210 L1115 350"/><path class="soft" d="M1115 350 L1010 500"/><g><circle cx="780" cy="210" r="39" fill="#fffdf8" stroke="#181714" stroke-width="2"/><path d="M765 201 h30 M765 210 h30 M765 219 h22" stroke="#181714" stroke-width="3"/><text class="small" x="780" y="275" text-anchor="middle">同一份账本</text></g><g><circle cx="675" cy="350" r="39" fill="#fffdf8" stroke="#181714" stroke-width="2"/><path d="M660 341 h30 M660 350 h30 M660 359 h22" stroke="#181714" stroke-width="3"/><text class="small" x="675" y="415" text-anchor="middle">同一份账本</text></g><g><circle cx="780" cy="500" r="39" fill="#fffdf8" stroke="#181714" stroke-width="2"/><path d="M765 491 h30 M765 500 h30 M765 509 h22" stroke="#181714" stroke-width="3"/><text class="small" x="780" y="565" text-anchor="middle">同一份账本</text></g><g><circle cx="1010" cy="210" r="39" fill="#fffdf8" stroke="#181714" stroke-width="2"/><path d="M995 201 h30 M995 210 h30 M995 219 h22" stroke="#181714" stroke-width="3"/><text class="small" x="1010" y="275" text-anchor="middle">同一份账本</text></g><g><circle cx="1115" cy="350" r="39" fill="#a65032" stroke="#181714" stroke-width="2"/><path d="M1100 341 h30 M1100 350 h30 M1100 359 h22" stroke="#f3f0e8" stroke-width="3"/><text class="small" x="1115" y="415" text-anchor="middle">同一份账本</text></g><g><circle cx="1010" cy="500" r="39" fill="#fffdf8" stroke="#181714" stroke-width="2"/><path d="M995 491 h30 M995 500 h30 M995 509 h22" stroke="#181714" stroke-width="3"/><text class="small" x="1010" y="565" text-anchor="middle">同一份账本</text></g><text class="small" x="900" y="620" text-anchor="middle">节点互相核验</text>
</svg>
