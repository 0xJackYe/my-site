<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">雅思口语训练闭环：准备真实故事、限时表达、回听诊断、修改重说</title>
  <desc id="desc">图：选一个真实的故事，讲两分钟，回听，改掉一个问题，再来一遍。</desc>
  <rect width="1200" height="675" fill="#f3f0e8"/>
  <style>
    text { font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif; fill: #181714; letter-spacing: 0; }
    .eyebrow { font-size: 21px; font-weight: 700; }
    .label { font-size: 28px; font-weight: 700; }
    .small { font-size: 17px; fill: #706b61; }
    .number { font-size: 17px; font-weight: 700; fill: #a65032; }
    .inverse { fill: #f3f0e8; }
    .node { fill: #fffdf8; stroke: #181714; stroke-width: 2; }
    .soft { fill: none; stroke: #b8b0a3; stroke-width: 2; }
    .strong { fill: none; stroke: #181714; stroke-width: 3; }
    .accent { fill: none; stroke: #a65032; stroke-width: 4; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#181714"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a65032"/></marker>
  </defs>
  <path class="strong" d="M694 156 C800 182 862 220 893 244" marker-end="url(#arrow)"/><path class="strong" d="M896 426 C862 472 790 514 694 524" marker-end="url(#arrow)"/><path class="strong" d="M506 524 C410 514 338 472 304 426" marker-end="url(#arrow)"/><path class="accent" d="M304 244 C338 198 404 164 506 148" marker-end="url(#arrow-accent)"/><g><circle cx="600" cy="126" r="94" fill="#fffdf8" stroke="#181714" stroke-width="2"/><text class="number" x="600" y="94" text-anchor="middle" style="fill:#a65032">01</text><text class="label" x="600" y="132" text-anchor="middle" style="font-size:24px;fill:#181714">准备</text><text class="small" x="600" y="166" text-anchor="middle" style="font-size:15px;fill:#706b61">选一个真实故事</text></g><g><circle cx="930" cy="335" r="94" fill="#a65032" stroke="#181714" stroke-width="2"/><text class="number" x="930" y="303" text-anchor="middle" style="fill:#f3f0e8">02</text><text class="label" x="930" y="341" text-anchor="middle" style="font-size:24px;fill:#f3f0e8">限时表达</text><text class="small" x="930" y="375" text-anchor="middle" style="font-size:15px;fill:#f3f0e8">录下 2 分钟</text></g><g><circle cx="600" cy="544" r="94" fill="#fffdf8" stroke="#181714" stroke-width="2"/><text class="number" x="600" y="512" text-anchor="middle" style="fill:#a65032">03</text><text class="label" x="600" y="550" text-anchor="middle" style="font-size:24px;fill:#181714">回听</text><text class="small" x="600" y="584" text-anchor="middle" style="font-size:15px;fill:#706b61">找出一个问题</text></g><g><circle cx="270" cy="335" r="94" fill="#fffdf8" stroke="#181714" stroke-width="2"/><text class="number" x="270" y="303" text-anchor="middle" style="fill:#a65032">04</text><text class="label" x="270" y="341" text-anchor="middle" style="font-size:24px;fill:#181714">重说</text><text class="small" x="270" y="375" text-anchor="middle" style="font-size:15px;fill:#706b61">改完再来一轮</text></g><circle cx="600" cy="335" r="58" fill="#181714"/><path d="M588 305 h24 a14 14 0 0 1 14 14 v26 a14 14 0 0