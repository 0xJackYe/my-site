<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">矿工、开发者和用户围绕比特币规则相互制衡的三角关系图</title>
  <desc id="desc">图：矿工、开发者和用户手里的权力各不相同，谁也没法单独把规则强加给其他人。</desc>
  <rect width="1200" height="675" fill="#f3f0e8"/>
  <style>
    text { font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif; fill: #181714; letter-spacing: 0; }
    .eyebrow { font-size: 21px; font-weight: 700; }
    .label { font-size: 28px; font-weight: 700; }
    .small { font-size: 17px; fill: #706b61; }
    .number { font-size: 17px; font-weight: 700; fill: #a65032; }
    .inverse { fill: #f3f0e8; }
    .node { fill: #fffdf8; stroke: #181714; stroke-width: 2; }
    .soft { fill: none; stroke: #b8b0a3; stroke-width: 2; }
    .strong { fill: none; stroke: #181714; stroke-width: 3; }
    .accent { fill: none; stroke: #a65032; stroke-width: 4; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#181714"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a65032"/></marker>
  </defs>
  <path class="strong" d="M543 254 L360 409" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path class="strong" d="M657 254 L840 409" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path class="accent" d="M390 470 H810" marker-start="url(#arrow-accent)" marker-end="url(#arrow-accent)"/><g><circle cx="600" cy="190" r="80" fill="#fffdf8" stroke="#181714" stroke-width="2"/><text class="label" x="600" y="200.08" text-anchor="middle" style="font-size:28px">矿工</text><text class="small" x="600" y="78" text-anchor="middle">打包交易，提供算力</text></g><g><circle cx="300" cy="470" r="80" fill="#fffdf8" stroke="#181714" stroke-width="2"/><text class="label" x="300" y="480.08" text-anchor="middle" style="font-size:28px">开发者</text><text class="small" x="300" y="588" text-anchor="middle">提出并维护代码</text></g><g><circle cx="900" cy="470" r="80" fill="#fffdf8" stroke="#181714" stroke-width="2"/><text class="label" x="900" y="480.08" text-anchor="middle" style="font-size:28px">用户</text><text class="small" x="900" y="588" text-anchor="middle">选择采用或拒绝</text></g><rect x="490" y="330" width="220" height="72" rx="36" fill="#181714"/><text class="inverse" x="600" y="374" text-anchor="middle" style="font-size:21px;font-weight:700">共同规则</text><text class="small" x="600" y="645" text-anchor="middle">没有任何一方可以单独决定整个网络</text>
</svg>
