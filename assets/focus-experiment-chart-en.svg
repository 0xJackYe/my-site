<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
<title id="title">Seven IELTS reading and listening scores, split by whether I took L-theanine and guarana</title>
<desc id="desc">Figure: One dot per session, colored by condition; each line is that group’s average. Notice how far the 8.5 in reading on 06.14 sits from everything else.</desc>
<style>
  svg { font-family: Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif; }
  .bg { fill: #fafaf9; } .ink { fill: #161615; } .soft { fill: #3b3b38; } .muted { fill: #6b6b66; }
  .grid { stroke: rgba(22,22,21,0.08); } .ring { stroke: #fafaf9; } .key-mean { stroke: #a3a39d; }
  .control { fill: #2a78d6; } .combo { fill: #eb6834; } .mean-control { stroke: #2a78d6; } .mean-combo { stroke: #eb6834; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0b0b0a; } .ink { fill: #ededea; } .soft { fill: #c9c9c4; } .muted { fill: #96968f; }
    .grid { stroke: rgba(237,237,234,0.08); } .ring { stroke: #0b0b0a; } .key-mean { stroke: #5e5e59; }
    .control { fill: #3987e5; } .combo { fill: #d95926; } .mean-control { stroke: #3987e5; } .mean-combo { stroke: #d95926; }
  }
</style>
